name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # the ends of the supported range: the floor requires-python names, and
      # the newest release. One job either side catches what a version moves,
      # which is how the missing imports below got through: 3.14 defers
      # annotation evaluation and 3.11 does not.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      # the suite guards itself against being run whole by accident;
      # CI is the caller that means it, so it asks.
      - run: pytest -n auto -q --full
